<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MA Contract Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
/* MA Contract Tracker (full-screen): dark sidebar on the left (menu, quick views, account), full-width content on the right.
   Urgency colours are always paired with a text label. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#EDF0F6;
  --ink:#121A2B; --ink-2:#434D66; --ink-3:#5B6681; --line:#DCE1EB;
  --accent:#2457D6; --accent-ink:#FFFFFF; --accent-soft:#E3EBFC;
  --todo:#5B6681; --todo-bg:#E9ECF3; --todo-bar:#8E99B3;
  --doing:#2457D6; --doing-bg:#E3EBFC; --doing-bar:#2457D6;
  --review:#8A5200; --review-bg:#FFEFD0; --review-bar:#E39A1B;
  --done:#0F6B3E; --done-bg:#DAF1E5; --done-bar:#23A064;
  --bad:#B42323; --bad-bg:#FDE3E3; --bad-bar:#D84343; --bad-solid:#C23030;
  --c-open:#2457D6; --c-done:#23A064;
  --shadow:0 1px 2px rgba(18,26,43,.06),0 4px 16px rgba(18,26,43,.05);
  --font-display:'Prompt','IBM Plex Sans Thai',system-ui,'Leelawadee UI',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Thai','Noto Sans Thai','Leelawadee UI',system-ui,Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1422; --surface:#161E31; --surface-2:#1D2740;
    --ink:#E8ECF6; --ink-2:#B0BAD2; --ink-3:#8F9AB5; --line:#28324C;
    --accent:#6C97FF; --accent-ink:#0E1422; --accent-soft:#1F2D52;
    --todo:#A3AEC8; --todo-bg:#232C44; --todo-bar:#6B7694;
    --doing:#7FA3FF; --doing-bg:#1F2D52; --doing-bar:#6C97FF;
    --review:#F0B04A; --review-bg:#3A2D14; --review-bar:#E39A1B;
    --done:#4BC98A; --done-bg:#12352A; --done-bar:#2FB473;
    --bad:#FF8080; --bad-bg:#3E1A1E; --bad-bar:#E65C5C; --bad-solid:#C23030;
    --c-open:#5B87F0; --c-done:#2AA366;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1422; --surface:#161E31; --surface-2:#1D2740;
  --ink:#E8ECF6; --ink-2:#B0BAD2; --ink-3:#8F9AB5; --line:#28324C;
  --accent:#6C97FF; --accent-ink:#0E1422; --accent-soft:#1F2D52;
  --todo:#A3AEC8; --todo-bg:#232C44; --todo-bar:#6B7694;
  --doing:#7FA3FF; --doing-bg:#1F2D52; --doing-bar:#6C97FF;
  --review:#F0B04A; --review-bg:#3A2D14; --review-bar:#E39A1B;
  --done:#4BC98A; --done-bg:#12352A; --done-bar:#2FB473;
  --bad:#FF8080; --bad-bg:#3E1A1E; --bad-bar:#E65C5C; --bad-solid:#C23030;
    --c-open:#5B87F0; --c-done:#2AA366;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.3;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.muted{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* buttons and controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:500;min-height:38px;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad-solid);border-color:var(--bad-solid);color:#fff}
.btn[disabled]{opacity:.6;cursor:default}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;color:var(--ink-3)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.del:hover{color:var(--bad)}
input[type=text],input[type=search],input[type=date],input[type=password],select.f,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;min-height:40px}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px 22px;box-shadow:var(--shadow);width:100%}
.tile::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.tile:hover{background:var(--surface-2)}
.tile-num{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile-label{font-size:14px;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.card-h h2{font-size:16px}
.empty{padding:20px 8px;text-align:center;color:var(--ink-3)}
.empty .btn{margin-top:10px}
.opt{font-weight:400;color:var(--ink-3)}
.seg.two{grid-template-columns:repeat(2,1fr)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:500;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center}
.fchip:hover{background:var(--surface-2)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchip .n{font-variant-numeric:tabular-nums;opacity:.85}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,30,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(580px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.panel h2{font-size:19px;margin-bottom:16px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-weight:500;font-size:14px}
.req{color:var(--bad)}
.hint{font-size:12px;color:var(--ink-3)}
.err{font-size:13px;color:var(--bad);min-height:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg-o{position:relative;display:block}
.seg-o input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg-o span{display:block;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-weight:500;background:var(--surface)}
.seg-o input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg-o input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

.ulist{display:grid;gap:10px}
.urow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.urow.off{opacity:.65}
.urow .avatar{width:40px;height:40px}
.urow b{font-weight:600;overflow-wrap:anywhere}
.urow .un{font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
.urow .meta{font-size:13px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
.role{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5;background:var(--accent-soft);color:var(--accent);vertical-align:1px;white-space:nowrap}
.role.off{background:var(--surface-2);color:var(--ink-3)}
.note-card{margin-bottom:14px;font-size:14px;color:var(--ink-2)}
.stamp{font-size:12px;color:var(--ink-3);margin:-2px 0 12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;margin:0}
.acct{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.acct .avatar{width:44px;height:44px}
.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
.ro{background:var(--surface-2)!important;color:var(--ink-2)}
.lock{max-width:380px;margin:48px auto}
.lock.wide{max-width:440px}
.lock h1{font-size:20px;margin-bottom:4px}
.lock .sub{color:var(--ink-3);font-size:14px;margin-bottom:16px}
.is-locked .user{display:none}
/* app shell: dark sidebar on the left, content uses the full width on the right */
:root{--side-bg:#0F1C3F;--side-ink:#D5DDF3;--side-ink-2:#A9B6D8;--side-ink-3:#8FA1D0;--side-hover:rgba(255,255,255,.09);--side-w:248px;
  --av0:#175CD3;--av1:#067647;--av2:#B54708;--av3:#5925DC;--av4:#C11574;--av5:#0E7090}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--side-bg:#0A1020;--av0:#8FB1FF;--av1:#6CE9A6;--av2:#FDB022;--av3:#B692F6;--av4:#F670C7;--av5:#67E3F9}}
:root[data-theme="dark"]{--side-bg:#0A1020;--av0:#8FB1FF;--av1:#6CE9A6;--av2:#FDB022;--av3:#B692F6;--av4:#F670C7;--av5:#67E3F9}

.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh;align-items:start}
.content{min-width:0}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side-bg);color:var(--side-ink);padding:22px 14px 16px;display:flex;flex-direction:column;gap:24px;z-index:20}
.side :focus-visible{outline-color:#9DB8FF}
.brand{display:flex;gap:12px;align-items:center;min-width:0;padding:0 6px}
.mark{width:40px;height:40px;border-radius:11px;background:#2457D6;color:#fff;display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.25;color:var(--ink)}
.brand-sub{font-size:11.5px;line-height:1.35;color:var(--ink-3);margin-top:2px}
.side .brand-name{color:#fff}
.side .brand-sub{color:var(--side-ink-2)}
#nav{display:flex;flex-direction:column;gap:4px}
#nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:15px;white-space:nowrap}
#nav a:hover{background:var(--side-hover)}
#nav a[aria-current="page"]{background:#2457D6;color:#fff}
#nav .nv-t{flex:1}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#D92D20;color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.quick{display:flex;flex-direction:column;gap:2px}
.quick-h{padding:0 12px 8px;font-size:12px;font-weight:600;color:var(--side-ink-3)}
.qv{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:0;border-radius:9px;background:transparent;color:var(--side-ink);font-size:14px;text-align:left}
.qv:hover{background:var(--side-hover)}
.qv[aria-current="true"]{background:var(--side-hover);color:#fff;font-weight:600}
.qd{width:9px;height:9px;border-radius:50%;flex:none}
.qv span:first-of-type{flex:1}
.qn{margin-left:auto;color:var(--side-ink-2);font-variant-numeric:tabular-nums}
.side-gap{flex:1}
.user{display:flex;align-items:center;gap:4px;padding:10px;border-radius:12px;background:rgba(255,255,255,.07)}
.user-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:2px;border-radius:10px;text-align:left;color:inherit}
.user-btn:hover{background:var(--side-hover)}
.user-txt{min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;background:#D1E9FF;color:#175CD3;display:grid;place-items:center;font-weight:700;font-family:var(--font-display);flex:none}
.user-name{font-size:14px;font-weight:600;line-height:1.25;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:12px;color:var(--side-ink-2)}
.user .icon-btn{width:40px;height:40px;color:var(--side-ink);flex:none}
.user .icon-btn:hover{background:var(--side-hover);color:#fff}
#banner:not(:empty){background:var(--review-bg);color:var(--review);padding:10px 24px;text-align:center;font-size:14px}
.lock-brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{padding:28px 36px 64px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:14px 24px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:30px;font-weight:700}
.page-head .sub{color:var(--ink-3);font-size:14.5px;margin-top:4px}
.loading{padding:48px 0;text-align:center;color:var(--ink-3)}
.is-locked .app{grid-template-columns:minmax(0,1fr)}
.is-locked .side{display:none}
.is-locked .wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.is-locked .lock{margin:0;width:100%}

/* bigger, calmer controls and cards */
.btn{min-height:42px;border-radius:11px;padding:0 18px}
.alert .btn{min-height:32px;padding:4px 12px}
input[type=text],input[type=search],input[type=date],input[type=password],select.f,textarea{border-radius:11px;min-height:44px}
textarea{min-height:76px}
.card{border-radius:16px;padding:20px 22px}
.card-h h2{font-size:19px;font-weight:700}


/* ---- MA Contract Tracker additions ---- */
:root{
  --u-expired-fg:#9B1C1C; --u-expired-bg:#FBE0E0;
  --u-d30-fg:#A83F08;     --u-d30-bg:#FFE6D5;
  --u-d90-fg:#8A5200;     --u-d90-bg:#FFEFD0;
  --u-d365-fg:#1D4FBF;    --u-d365-bg:#E3EBFC;
  --u-long-fg:#0F6B3E;    --u-long-bg:#DAF1E5;
  --u-none-fg:#434D66;    --u-none-bg:#E9ECF3;
  --bar:#5B87F0; --bar-on:#2457D6; --grid:#E4E8F0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --u-expired-fg:#FF9A9A; --u-expired-bg:#3E1A1E;
    --u-d30-fg:#FFA66B;     --u-d30-bg:#3F2312;
    --u-d90-fg:#F0B04A;     --u-d90-bg:#3A2D14;
    --u-d365-fg:#8FB0FF;    --u-d365-bg:#1F2D52;
    --u-long-fg:#4BC98A;    --u-long-bg:#12352A;
    --u-none-fg:#B0BAD2;    --u-none-bg:#232C44;
    --bar:#5B87F0; --bar-on:#9DB8FF; --grid:#28324C;
  }
}
:root[data-theme="dark"]{
  --u-expired-fg:#FF9A9A; --u-expired-bg:#3E1A1E;
  --u-d30-fg:#FFA66B;     --u-d30-bg:#3F2312;
  --u-d90-fg:#F0B04A;     --u-d90-bg:#3A2D14;
  --u-d365-fg:#8FB0FF;    --u-d365-bg:#1F2D52;
  --u-long-fg:#4BC98A;    --u-long-bg:#12352A;
  --u-none-fg:#B0BAD2;    --u-none-bg:#232C44;
  --bar:#5B87F0; --bar-on:#9DB8FF; --grid:#28324C;
}
input[type=number],input[type=tel],input.num{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 12px;min-height:44px;font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select.f{appearance:auto}
.btn.sm{min-height:34px;padding:4px 12px;white-space:nowrap}
.btn.ghost-danger{color:var(--bad);border-color:var(--bad-bg);background:transparent}
.btn.ghost-danger:hover{background:var(--bad-bg)}
.link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;overflow-wrap:anywhere}
.link:hover{color:var(--accent);text-decoration:underline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* urgency badges: always a text label, colour is only the second cue */
.ub{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;line-height:1.5}
.b-expired{color:var(--u-expired-fg);background:var(--u-expired-bg)}
.b-d30{color:var(--u-d30-fg);background:var(--u-d30-bg)}
.b-d90{color:var(--u-d90-fg);background:var(--u-d90-bg)}
.b-d365{color:var(--u-d365-fg);background:var(--u-d365-bg)}
.b-long{color:var(--u-long-fg);background:var(--u-long-bg)}
.b-none,.b-closed{color:var(--u-none-fg);background:var(--u-none-bg)}


/* ---- overview: urgency tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-bottom:16px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow);color:inherit}
.tile::before{content:none}
.tile:hover{border-color:var(--accent);background:var(--surface)}
.tile-top{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink-2);font-size:13.5px;line-height:1.3;min-height:38px}
.tile-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.tile-ic svg{width:18px;height:18px}
.tile-num{margin-top:4px;display:flex;align-items:baseline;gap:8px;font-family:var(--font-display);font-size:42px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile-num small{font:400 14px var(--font-body);color:var(--ink-3)}
.tile.hot.k-expired .tile-num{color:var(--u-expired-fg)}
.tile.hot.k-d30 .tile-num{color:var(--u-d30-fg)}
.tile-val{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* distribution strip */
.mix{margin-bottom:16px;padding:18px 22px}
.mix-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px;flex-wrap:wrap}
.mix-h h2{font-size:17px;font-weight:700}
.mix-h p{font-size:13.5px;color:var(--ink-3)}
.mixbar{display:flex;gap:3px;height:14px;margin:12px 0 12px}
.mixbar i{display:block;min-width:5px;background:var(--mc)}
.mixbar i:first-child{border-radius:7px 0 0 7px}
.mixbar i:last-child{border-radius:0 7px 7px 0}
.mixbar i:only-child{border-radius:7px}
.mixleg{display:flex;flex-wrap:wrap;gap:4px 8px}
.mixleg button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:8px;padding:4px 8px;font-size:13.5px;color:var(--ink-2)}
.mixleg button:hover{background:var(--surface-2);color:var(--ink)}
.mixleg i{width:10px;height:10px;border-radius:3px;background:var(--mc);flex:none}
.mixleg b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.m-expired{--mc:var(--u-expired-fg)}.m-d30{--mc:var(--u-d30-fg)}.m-d90{--mc:var(--u-d90-fg)}.m-d365{--mc:var(--u-d365-fg)}.m-long{--mc:var(--u-long-fg)}.m-other{--mc:var(--ink-3)}

.cols2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.cols2>.col-a,.cols2>.col-b{min-width:0}
.cols2>.col-b{display:grid;gap:16px}
.card.flush{padding:0}
.card-hd{padding:18px 22px 12px}
.card-hd h2{font-size:18px;font-weight:700}
.card-hd p{font-size:13.5px;color:var(--ink-3);margin-top:2px}
.card-hd .card-h{margin:0;align-items:flex-start}
.prow2{display:grid;grid-template-columns:128px minmax(0,1fr) 92px auto;grid-template-areas:"when what end btn";align-items:center;gap:8px 16px;padding:13px 22px;border-top:1px solid var(--line)}
.prow2:hover{background:var(--surface-2)}
.prow2 .when{grid-area:when}
.prow2 .what{grid-area:what;min-width:0}
.prow2 .what .t{font-weight:600;overflow-wrap:anywhere}
.prow2 .what .s{font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
.prow2 .end{grid-area:end;text-align:right;font-variant-numeric:tabular-nums}
.prow2 .end .s{font-size:13px;color:var(--ink-3)}
.prow2>.btn{grid-area:btn}
.autochip{display:inline-block;margin-left:6px;padding:0 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:500;vertical-align:1px;white-space:nowrap}
/* month chart */
.mchart{display:flex;gap:8px;padding:0 22px}
.my{width:20px;height:150px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font-size:11.5px;color:var(--ink-3);line-height:1;font-variant-numeric:tabular-nums}
.mplot{position:relative;flex:1;min-width:0}
.mgrid{position:relative;height:150px;border-bottom:1px solid var(--line)}
.mgrid i{position:absolute;left:0;right:0;border-top:1px dashed var(--grid)}
.mcols{position:absolute;inset:0;display:flex;gap:4px}
.mcol{flex:1 1 0;min-width:0;padding:0;border:0;background:transparent;display:flex;align-items:flex-end;justify-content:center;border-radius:6px 6px 0 0}
.mcol:hover{background:var(--surface-2)}
.mcol .bar{display:block;width:68%;max-width:30px;border-radius:4px 4px 0 0;background:var(--bar)}
.mcol[aria-pressed="true"] .bar{background:var(--bar-on)}
.mcol[aria-pressed="true"]{background:var(--surface-2)}
.mx{display:flex;gap:4px;margin-top:6px}
.mx span{flex:1 1 0;min-width:0;text-align:center;font-size:11px;line-height:1.25;color:var(--ink-3)}
.mx em{display:block;font-style:normal;font-size:10.5px}
.mdetail{margin:12px 22px 0;padding:10px 14px;border-radius:10px;background:var(--bg);min-height:64px}
.mdetail b{font-weight:600}
.mdetail .s{font-size:12.5px;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.mfoot{margin:10px 22px 18px;font-size:12px;color:var(--ink-3)}

/* clean-up panel */
.fixrow{display:flex;gap:12px;align-items:flex-start;padding:12px 22px;border-top:1px solid var(--line)}
.fix-ic{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--u-d90-bg);color:var(--u-d90-fg)}
.fixrow b{font-weight:600}
.fixrow .s{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.fixrow .btn{margin-top:6px}
.allgood{display:flex;gap:10px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);color:var(--u-long-fg);font-weight:500}


/* ---- contract list ---- */
.toolbar2{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.search{position:relative;flex:0 1 340px;min-width:220px}
.search svg{position:absolute;left:14px;top:14px;color:var(--ink-3);pointer-events:none}
.search input{padding-left:40px}
.toolbar2 .chips{margin:0;flex:1 1 auto}
.fchip{min-height:36px;padding:4px 12px;font-size:13.5px}
.toolbar2 .chips{gap:6px}
.fchip .n{font-size:12.5px;min-width:22px;text-align:center;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);opacity:1}
.fchip[aria-pressed="true"] .n{background:var(--surface);color:var(--accent)}
.ctable{container-type:inline-size;container-name:ct;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(220px,1.7fr) minmax(120px,1fr) 150px 96px 100px 168px;gap:10px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);min-height:64px}
.crow:not(.chead):hover{background:var(--surface-2)}
.crow.r-expired{box-shadow:inset 3px 0 0 var(--u-expired-fg)}
.crow.r-d30{box-shadow:inset 3px 0 0 var(--u-d30-fg)}
.chead{background:var(--surface-2);border-top:0;font-size:12.5px;font-weight:600;color:var(--ink-2);min-height:0;padding:11px 18px}
.crow .sub{font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
.crow .sub-sup{display:none}
.crow .c-sup{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.crow .c-per{font-size:13px;font-variant-numeric:tabular-nums}
.crow .c-per .warn{font-size:12px;font-weight:500;color:var(--u-d90-fg)}
.crow .c-rem{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.crow .c-rem.late{color:var(--u-expired-fg)}
.crow .c-amt{text-align:right;font-variant-numeric:tabular-nums}
.crow .c-act{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.pager .pg{display:flex;gap:6px;align-items:center}
.pgbtn{min-width:38px;min-height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.pgbtn:hover{background:var(--surface-2)}
.pgbtn[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pgbtn[disabled]{opacity:.5;cursor:default}
.ctable .empty{padding:36px 8px}

/* medium width: the supplier moves under the title */
@container ct (max-width:1090px){
  .crow{grid-template-columns:116px minmax(220px,1fr) 146px 92px 96px 168px}
  .chead>div:nth-child(3){display:none}
  .crow .c-sup{display:none}
  .crow .sub-sup{display:inline}
}
/* compact: two lines per row */
@container ct (max-width:940px){
  .chead{display:none}
  .crow{grid-template-columns:170px 90px minmax(0,1fr) auto;grid-template-areas:"main main main stat" "per rem amt act";gap:8px 12px;padding:12px 16px}
  .crow .c-status{grid-area:stat;justify-self:end}
  .crow .c-main{grid-area:main}
  .crow .c-sup{display:none}
  .crow .sub-sup{display:inline}
  .crow .c-per{grid-area:per}
  .crow .c-rem{grid-area:rem}
  .crow .c-amt{grid-area:amt;text-align:right}
  .crow .c-act{grid-area:act}
}
/* narrow: each row becomes a small card */
@container ct (max-width:600px){
  .crow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"main stat" "sup sup" "per rem" "amt act";gap:6px 12px;padding:14px 16px}
  .crow .c-sup{display:block;grid-area:sup}
  .crow .sub-sup{display:none}
  .crow .c-rem{justify-self:end}
  .crow .c-amt{text-align:left}
}

/* users */
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
.urow{padding:16px 18px;border-radius:16px}
.urow .avatar{width:44px;height:44px}
.note-card{margin-bottom:16px}
/* detail / renew / edit modals */
.panel.wide{width:min(880px,100%)}
.panel.mid{width:min(680px,100%)}
.dl{display:grid;grid-template-columns:128px minmax(0,1fr);gap:8px 12px;font-size:14px;margin:0}
.dl dt{color:var(--ink-3)}
.dl dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.rn{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.rn-cur{flex:1 1 280px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.rn-cur h3{font-size:15px;margin-bottom:8px}
.rn-form{flex:1.7 1 400px;min-width:0}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.calc{min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:9px;background:var(--surface-2);padding:0 12px;font-variant-numeric:tabular-nums}
.infobox{background:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px;color:var(--ink-2)}
.infobox b{color:var(--ink)}
.infobox ul{margin:6px 0 0;padding-left:20px;display:grid;gap:3px}
.hist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.hist li{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13.5px}
.hist .h1{font-weight:600;font-variant-numeric:tabular-nums}
.hist .h2{color:var(--ink-2);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.spread{justify-content:space-between}

@media (max-width:1360px){
  .cols2{grid-template-columns:minmax(0,1fr)}
  .cols2>.col-b{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
@media (max-width:1180px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  .app{display:block}
  .side{position:sticky;top:0;height:auto;overflow:visible;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px}
  .brand{padding:0}
  .mark{width:34px;height:34px}
  .brand-sub,.quick,.side-gap{display:none}
  #nav{order:3;flex:1 0 100%;flex-direction:row;overflow-x:auto;gap:4px}
  #nav a{padding:8px 12px;font-size:14px;gap:8px}
  .user{margin-left:auto;padding:2px 4px;background:transparent}
  .user-txt{display:none}
  .wrap{padding:16px 14px 64px}
  .page-head h1{font-size:24px}
  .ulist{grid-template-columns:minmax(0,1fr)}
  .search{flex:1 1 100%}
  .cols2>.col-b{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tile{padding:14px}
  .tile-num{font-size:34px}
  .three{grid-template-columns:1fr}
  .dl{grid-template-columns:104px minmax(0,1fr)}
  .prow2{padding:12px 16px;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"when btn" "what end"}
  .card{padding:16px}
  .card-hd{padding:16px 16px 10px}
  .mix{padding:16px}
}
@media (max-width:640px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.side,#toast,#modal{display:none}.app{display:block}}

input.code{text-transform:uppercase;letter-spacing:.14em;font-weight:600}
input.code::placeholder{text-transform:none;letter-spacing:normal;font-weight:400}

  function svgI(d, size, sw) {

    if (d < 0) return -d > 365 ? 'เกิน ' + Math.floor(-d / 365) + ' ปี' : 'เกิน ' + (-d) + ' วัน';

  function whenText(c) {

    if (d < 0) return 'เกินกำหนด ' + (-d) + ' วัน';
    return d === 0 ? 'หมดวันนี้' : 'อีก ' + d + ' วัน';
  }
  // most urgent first: recently expired, then upcoming, then closed / no end date
  function sortKey(c) {
    var b = bucketOf(c), d = daysLeft(c.end);
    if (b === 'expired') return -1000000 - d;
    if (b === 'closed' || b === 'none') return 1000000;
    return d;
  }

    if (!q) return true;

  async function api(action, payload) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 25000);
    try {
      var res = await fetch(API_URL, {
        method: 'POST',
        // text/plain keeps this a simple request, so the browser sends no preflight
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action, token: token }, payload || {})),
        redirect: 'follow',
        signal: ctl.signal
      });
      var data = await res.json();
      if (!data || !data.ok) {
        var er = new Error((data && data.error) || 'bad_response');
        er.code = (data && data.error) || 'bad_response';
        throw er;
      }
      return data;
    } finally { clearTimeout(timer); }
  }

  function upsertLocal(arr, row) {
    for (var i = 0; i < arr.length; i++) if (arr[i].id === row.id) { arr[i] = row; return; }
    arr.push(row);
  }
  async function safe(fn, okMsg) {
    writing++; writeSeq++;
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) {
      console.error(e);
      if (e && e.code === 'bad_token') toLogin(ERR.bad_token);
      else toast('บันทึกไม่สำเร็จ: ' + errText(e));
      return false;
    } finally {
      writing--; writeSeq++;
      lastSig = '';
      render();
      refresh();
    }
  }
  async function refresh() {
    if (refreshing || writing > 0 || !token) return;
    refreshing = true;
    var seq = writeSeq;
    try {
      var data = await api('list');
      if (seq === writeSeq && writing === 0) {
        var sig = JSON.stringify([data.contracts, data.renewals, data.users, data.me]);
        var changed = sig !== lastSig || auth !== 'ok' || !!syncError;
        contracts = data.contracts; renewals = data.renewals; users = data.users; me = data.me;
        maxUsers = data.maxUsers || 5; lastSig = sig;
        auth = 'ok'; syncError = '';
        if (changed && !modalOpen()) render();
      }
    } catch (e) {
      if (e && e.code === 'bad_token') toLogin(auth === 'ok' ? ERR.bad_token : '');
      else { syncError = errText(e); render(); }

      '<div class="mixleg">' + mixItems.map(function (m) {
        return '<button type="button" class="m-' + m[0] + '" data-action="go-filter" data-f="' + m[0] + '"><i></i>' + esc(m[1]) + ' <b>' + m[2] + '</b></button>';
      }).join('') + '</div></section>';

    // priority list: expired within a year, or due within 90 days
    var pri = contracts.filter(function (c) {
      if (c.status === 'Ended' || !c.end) return false;
      var d = daysLeft(c.end);
      return d !== null && d >= -365 && d <= 90;
    }).sort(byUrgency);
    var priSum = pri.reduce(function (s, c) { return s + num(c.amount); }, 0);
    var priRows = pri.length ? pri.map(function (c) {
      return '<div class="prow2"><div class="when"><span class="ub b-' + bucketOf(c) + '">' + esc(whenText(c)) + '</span></div>' +
        '<div class="what"><div class="t"><button type="button" class="link" data-action="view" data-id="' + esc(c.id) + '">' + esc(c.title) + '</button>' + (c.auto === 'yes' ? '<span class="autochip">ต่ออัตโนมัติ</span>' : '') + '</div>' +
        '<div class="s">' + esc([c.groupName, c.supplier].filter(Boolean).join(' · ')) + '</div></div>' +
        '<div class="end"><div>' + esc(fmtShort(c.end)) + '</div><div class="s">' + (num(c.amount) ? money(c.amount) : '—') + '</div></div>' +
        '<button type="button" class="btn sm" data-action="renew" data-id="' + esc(c.id) + '" style="border-color:var(--accent);color:var(--accent)">ต่อสัญญา</button></div>';
    }).join('') : '<div class="allgood">' + ICON.check + 'ไม่มีสัญญาที่ต้องดำเนินการใน 90 วันนี้</div>';
    var priCard = '<section class="card flush" aria-labelledby="pri-h"><div class="card-hd"><div class="card-h" style="margin:0"><div><h2 id="pri-h">ต้องดำเนินการก่อน</h2>' +
      '<p>เพิ่งหมดอายุ และจะครบใน 90 วัน · ' + pri.length + ' รายการ · ' + money(priSum) + '</p></div>' +
      '<button type="button" class="btn sm" data-action="go-filter" data-f="all">ดูทั้งหมด ' + ICON.right + '</button></div></div>' + priRows + '</section>';

    // month chart: 12 months from this month, active contracts only
    var now = today(), months = [], i;
    for (i = 0; i < 12; i++) {
      var md = new Date(now.getFullYear(), now.getMonth() + i, 1);
      months.push({ y: md.getFullYear(), m: md.getMonth(), n: 0, sum: 0, names: [] });
    }
    var outside = 0;
    contracts.forEach(function (c) {
      var b = bucketOf(c);
      if (b === 'expired' || b === 'closed' || b === 'none') return;
      var d = parseYmd(c.end); if (!d) return;
      var hit = null;
      months.forEach(function (mm) { if (mm.y === d.getFullYear() && mm.m === d.getMonth()) hit = mm; });
      if (hit) { hit.n++; hit.sum += num(c.amount); hit.names.push(c.title); } else outside++;
    });
    var mx = Math.max.apply(null, months.map(function (m) { return m.n; }));
    var ymax = Math.max(2, Math.ceil(mx / 2) * 2);
    var sel = Math.min(Math.max(ui.month, 0), 11), sm = months[sel];
    var cols = months.map(function (m, k) {
      var h = Math.round(m.n / ymax * 150);
      return '<button type="button" class="mcol" data-action="pick-month" data-i="' + k + '" aria-pressed="' + (k === sel) + '" aria-label="' + MON_S[m.m] + ' ' + (m.y + 543) + ': ' + m.n + ' รายการ"><span class="bar" style="height:' + h + 'px"></span></button>';
    }).join('');
    var xl = months.map(function (m, k) {
      return '<span>' + MON_S[m.m] + '<em>' + (k === 0 || m.m === 0 ? String(m.y + 543).slice(2) : '&nbsp;') + '</em></span>';
    }).join('');
    var names = sm.names.length
      ? esc(sm.names.slice(0, 3).join(' · ')) + (sm.names.length > 3 ? ' · และอีก ' + (sm.names.length - 3) + ' รายการ' : '')
      : 'ไม่มีรายการหมดอายุในเดือนนี้';
    var chart = '<section class="card flush" aria-labelledby="ch-h"><div class="card-hd"><h2 id="ch-h">ครบกำหนดรายเดือน</h2><p>จำนวนรายการที่หมดอายุในแต่ละเดือน · 12 เดือนข้างหน้า</p></div>' +
      '<div class="mchart"><div class="my"><span>' + ymax + '</span><span>' + (ymax / 2) + '</span><span>0</span></div><div class="mplot">' +
      '<div class="mgrid"><i style="top:0"></i><i style="top:50%"></i><div class="mcols">' + cols + '</div></div><div class="mx">' + xl + '</div></div></div>' +
      '<div class="mdetail" aria-live="polite"><div><b>' + MON_S[sm.m] + ' ' + (sm.y + 543) + '</b> · ' + sm.n + ' รายการ · ' + money(sm.sum) + '</div><div class="s">' + names + '</div></div>' +
      '<p class="mfoot">ไม่รวม ' + outside + ' รายการที่หมดหลังจากช่วง 12 เดือนนี้</p></section>';

    var iss = issues();
    var fix = '<section class="card flush" aria-labelledby="fx-h"><div class="card-hd"><h2 id="fx-h">ข้อมูลที่ควรเคลียร์</h2><p>ระบบตรวจให้อัตโนมัติ — แก้แล้วตัวเลขข้างบนจะตรงขึ้น</p></div>' +
      (iss.length ? iss.map(function (x) {
        return '<div class="fixrow"><span class="fix-ic">' + ICON.alert + '</span><div><b>' + esc(x.title) + '</b><div class="s">' + esc(x.sub) + '</div>' +
          '<button type="button" class="btn sm" data-action="go-filter" data-f="' + x.f + '">ดูรายการ</button></div></div>';
      }).join('') : '<div class="allgood">' + ICON.check + 'ไม่พบข้อมูลที่ต้องเคลียร์</div>') + '</section>';

    return head + tiles + mix + '<div class="cols2"><div class="col-a">' + priCard + '</div><div class="col-b">' + chart + fix + '</div></div>';
  }

  async function submitUser(form) {
    var id = form.getAttribute('data-id');
    var err = $('#u-err');
    var name = $('#u-name').value.trim(), username = $('#u-user').value.trim().toLowerCase(), pinv = $('#u-pin').value;
    err.textContent = '';
    if (!name) { err.textContent = ERR.bad_name; $('#u-name').focus(); return; }
    if (!/^[a-z0-9._-]{2,24}$/.test(username)) { err.textContent = ERR.bad_username; $('#u-user').focus(); return; }
    if ((!id || pinv) && pinv.trim().length < 6) { err.textContent = ERR.weak_pin; $('#u-pin').focus(); return; }
    var roleEl = form.querySelector('input[name="role"]:checked');
    var payload = { id: id || undefined, name: name, username: username, role: roleEl ? roleEl.value : 'member' };
    if (pinv) payload.pin = pinv;
    var act = $('#u-active');
    if (id && act && !act.disabled) payload.active = act.checked;
    var btn = $('#saveBtn'); btn.disabled = true;
    try {
      var res = await api('userSave', payload);
      users = res.users;
      var mine = userById(me.id); if (mine) me = mine;
      lastSig = '';
      closeModal(); toast(id ? 'บันทึกผู้ใช้แล้ว' : 'เพิ่มผู้ใช้แล้ว');
      render(); refresh();
    } catch (e) {
      if (e && e.code === 'bad_token') { toLogin(ERR.bad_token); return; }
      err.textContent = errText(e); btn.disabled = false;
    }
  }

  function updateDelta() {
    var form = $('#renewForm'); if (!form) return;
    var el = $('#rn-delta'); if (!el) return;
    var old = Number(form.getAttribute('data-old')) || 0;
    var cur = num($('#rn-amount').value);
    if (!old || !cur) { el.textContent = ''; return; }
    var diff = cur - old;
    if (Math.abs(diff) < 0.005) el.textContent = 'เท่าปีก่อน';
    else el.textContent = (diff > 0 ? 'เพิ่มขึ้น ' : 'ลดลง ') + fmtNum(Math.abs(diff / old * 100)) + '% (' + (diff > 0 ? '+' : '−') + fmtNum(Math.abs(diff)) + ' บาท)';
  }

  async function doSetup() {
    var err = $('#su-err'), btn = $('#su-btn');
    var key = $('#su-key').value, u = $('#su-user').value.trim().toLowerCase(), nm = $('#su-name').value.trim();
    var p = $('#su-pin').value, p2 = $('#su-pin2').value;
    err.textContent = '';
    if (!key) { err.textContent = 'ใส่รหัสตั้งค่าก่อน'; $('#su-key').focus(); return; }
    if (THAI.test(key)) { err.textContent = ERR.thai_kb; $('#su-key').focus(); return; }
    if (THAI.test(u)) { err.textContent = ERR.thai_kb; $('#su-user').focus(); return; }
    if (!/^[a-z0-9._-]{2,24}$/.test(u)) { err.textContent = ERR.bad_username; $('#su-user').focus(); return; }
    if (!nm) { err.textContent = ERR.bad_name; $('#su-name').focus(); return; }
    if (p.trim().length < 6) { err.textContent = ERR.weak_pin; $('#su-pin').focus(); return; }
    if (p !== p2) { err.textContent = 'PIN ใหม่ทั้งสองช่องไม่ตรงกัน'; $('#su-pin2').focus(); return; }
    btn.disabled = true;
    try {
      var res = await api('setup', { key: key, username: u, name: nm, pin: p });
      signedIn(res, u);
      toast('สร้างบัญชีผู้ดูแลระบบแล้ว');
    } catch (e) {
      if (e && e.code === 'already_setup') { lockError = ERR.already_setup; loadMode(); return; }
      err.textContent = errText(e); btn.disabled = false;
    }
  }

  /* ---------- documents ---------- */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? resolve() : reject(new Error('copy')); } catch (e) { reject(e); } finally { document.body.removeChild(ta); }
    });
  }
  function openDoc(c) {
    var p = String(c.docPath || '').trim();
    if (!p) return;
    if (isUrl(p)) { window.open(p, '_blank', 'noopener'); return; }
    copyText(p).then(function () { toast('คัดลอกที่อยู่เอกสารแล้ว — วางใน File Explorer ได้เลย'); },
      function () { toast('คัดลอกไม่ได้ ที่อยู่คือ: ' + p); });
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains('overlay')) { closeModal(); return; }
    var el = t.closest ? t.closest('[data-action]') : null;
    if (!el || el.tagName === 'SELECT') return;
    var a = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');
    var c = id ? findContract(id) : null;

    if (a === 'go-filter') { ui.f = el.getAttribute('data-f'); ui.q = ''; ui.page = 0; if (location.hash !== '#contracts') location.hash = 'contracts'; else render(); }
    else if (a === 'filter') { ui.f = el.getAttribute('data-f'); ui.page = 0; render(); }
    else if (a === 'clear-filters') { ui.f = 'all'; ui.q = ''; ui.page = 0; render(); }
    else if (a === 'page') { var p = parseInt(el.getAttribute('data-p'), 10); if (!isNaN(p) && p >= 0) { ui.page = p; render(); } }
    else if (a === 'pick-month') { ui.month = parseInt(el.getAttribute('data-i'), 10) || 0; render(); }
    else if (a === 'add') openEditModal(null);
    else if (a === 'view') { if (c) openViewModal(c); }
    else if (a === 'edit') { if (c) openEditModal(c); }
    else if (a === 'renew') { if (c) openRenewModal(c); }
    else if (a === 'doc') { if (c) openDoc(c); }
    else if (a === 'del') {
      if (c) openConfirm('ลบสัญญานี้?', '"' + c.title + '" และประวัติการต่อสัญญาของรายการนี้จะถูกลบถาวร (ถ้าแค่เลิกใช้ ให้เปลี่ยนสถานะเป็น “ปิดสัญญาแล้ว” แทน)', 'ลบสัญญา', async function () {
        var ok = await safe(async function () {
          await api('remove', { id: id });
          contracts = contracts.filter(function (x) { return x.id !== id; });
          renewals = renewals.filter(function (x) { return x.contractId !== id; });
        }, 'ลบสัญญาแล้ว');
        if (ok) closeModal();
      });
    }
    else if (a === 'confirm-ok') { var fn = pendingConfirm; if (fn) { el.disabled = true; fn(); } }
    else if (a === 'close-modal') closeModal();
    else if (a === 'retry') { syncError = ''; if (token) { auth = 'checking'; render(); refresh(); } else loadMode(); }
    else if (a === 'logout') logout();
    else if (a === 'account') openAccountModal();
    else if (a === 'add-user') { if (isAdmin()) openUserModal(null); }
    else if (a === 'edit-user') { var eu = userById(id); if (eu && isAdmin()) openUserModal(eu); }
  });

  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'q') { ui.q = e.target.value; ui.page = 0; render(); return; }
    if (id === 'su-key' || id === 'su-user') {
      var bad = THAI.test(e.target.value), er = document.getElementById('su-err');
      if (er) er.textContent = bad ? ERR.thai_kb : (er.textContent === ERR.thai_kb ? '' : er.textContent);
      return;
    }
    // amount follows quantity x price until someone types in the amount box
    var pre = id === 'f-qty' || id === 'f-unit' ? 'f-' : (id === 'rn-qty' || id === 'rn-unit' ? 'rn-' : '');
    if (pre) {
      var amt = document.getElementById(pre + 'amount');
      if (amt && amt.getAttribute('data-manual') !== '1') {
        var q = num($('#' + pre + 'qty').value), u = num($('#' + pre + 'unit').value);
        if (q && u) amt.value = String(Math.round(q * u * 100) / 100);
      }
      if (pre === 'rn-') updateDelta();
    } else if (id === 'f-amount' || id === 'rn-amount') {
      e.target.setAttribute('data-manual', '1');
      if (id === 'rn-amount') updateDelta();
    } else if (id === 'rn-start') {
      var endEl = $('#rn-end');
      if (endEl && endEl.getAttribute('data-manual') !== '1') endEl.value = addYear(e.target.value);
    } else if (id === 'rn-end') {
      e.target.setAttribute('data-manual', '1');
    }
  });

  document.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'f-noexp') {
      var endEl = $('#f-end');
      endEl.disabled = e.target.checked;
      if (e.target.checked) endEl.value = '';
      else if (!endEl.value && $('#f-start').value) endEl.value = addYear($('#f-start').value);
    } else if (id === 'f-start') {
      var fe = $('#f-end');
      if (fe && !fe.disabled && !fe.value) fe.value = addYear(e.target.value);
    }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = e.target.id;
    if (id === 'loginForm') doLogin();
    else if (id === 'setupForm') doSetup();
    else if (id === 'userForm') submitUser(e.target);
    else if (id === 'pinForm') submitPin();
    else if (id === 'contractForm') submitContract(e.target);
    else if (id === 'renewForm') submitRenew(e.target);
  });

  document.addEventListener('keydown', function (e) {
    if (!modalOpen()) return;
    if (e.key === 'Escape') { closeModal(); return; }
    if (e.key === 'Tab') {
      var f = $('#modal').querySelectorAll('input:not([type=radio]):not([disabled]),select,textarea,button:not([disabled]),input[type=radio]:checked');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  function route() {
    var h = location.hash.replace('#', '');
    ui.view = VIEWS.indexOf(h) >= 0 ? h : 'dashboard';
    render();
  }
  window.addEventListener('hashchange', route);

  /* ---------- start ---------- */
  function init() {
    token = readTok();
    route();
    if (token) refresh(); else loadMode();
    setInterval(function () { if (auth === 'ok' && !document.hidden) refresh(); }, POLL_MS);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && auth === 'ok') refresh(); });
  }
  init();
})();
</script>
</body>
</html>
